<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Install BmetSim</title>
<style>
  :root{color-scheme:light dark; --paper:#F4EEE6; --ink:#2A2521; --ink2:#6F655D; --accent:#B9532C; --card:#FBF8F3}
  @media (prefers-color-scheme: dark){:root{--paper:#1C1916; --ink:#F2EBE1; --ink2:#A99E92; --accent:#E1784D; --card:#26221E}}
  body{margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:500 17px/1.45 ui-rounded, system-ui, sans-serif; text-align:center; padding:24px}
  img{width:120px; height:120px; border-radius:27px; box-shadow:0 12px 40px rgba(0,0,0,.12)}
  h1{font-weight:600; font-size:34px; margin:22px 0 4px}
  p{margin:0; color:var(--ink2)}
  a.go{display:inline-block; margin:28px 0 18px; padding:15px 46px; border-radius:999px; background:var(--accent); color:var(--card); text-decoration:none; font-weight:600}
  small{display:block; max-width:340px; margin:0 auto; color:var(--ink2); font-size:13px}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>BmetSim</h1>
  <p>Version 0.1 · build 202611252045 · Nov 25, 8:45 PM</p>
  <a class="go" href="itms-services://?action=download-manifest&url=https://futureu.github.io/bmetsim-ota/manifest.plist">Install</a>
  <small>Open this page in Safari on a registered iPhone. After it installs, BmetSim checks here for newer builds by itself.</small>
</main>
</body>
</html>
